services:
  fixedcoin-solo:
    build:
      context: .
      args:
        FIX_VER: "29.1.3"
    container_name: fixedcoin-solo
    restart: unless-stopped
    environment:
      FIX_DATADIR: /data/fixedcoin
      FIX_RPCUSER: ${FIX_RPCUSER:-fixrpc}
      FIX_RPCPASS: ${FIX_RPCPASS:-}
      FIX_RPCPORT: 24761
      FIX_P2PPORT: 24768
      # 5050 is reserved for the separate Next.js LiveShare container on the host.
      # The Flask API therefore listens on 5051 inside this container.
      FIX_DASH_PORT: 5051
      FIX_PAYOUT_ADDRESS: ${FIX_PAYOUT_ADDRESS:-}
      COINBASE_MATURITY: ${COINBASE_MATURITY:-100}
      AXEOS_URL: ${AXEOS_URL:-http://192.168.50.133}
    ports:
      - "3333:3333"
      - "5051:5051"
      - "24768:24768"
    volumes:
      - fix-data:/data
    shm_size: 1gb
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          RPCPASS=$$(sed -n 's/^rpcpassword=//p' /data/fixedcoin/fixedcoin.conf | head -1);
          fixedcoin-cli -datadir=/data/fixedcoin -rpcuser=$${FIX_RPCUSER:-fixrpc}
          -rpcpassword="$$RPCPASS" getblockchaininfo >/dev/null 2>&1
          && curl -fsS http://127.0.0.1:$${FIX_DASH_PORT:-5051}/api/status >/dev/null 2>&1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  liveshare-dashboard:
    build:
      context: ./frontend
    container_name: liveshare-dashboard
    restart: unless-stopped
    depends_on:
      fixedcoin-solo:
        condition: service_healthy
    ports:
      - "5050:3000"
    networks:
      - default

  swarm-connector:
    build:
      context: ./swarm-connector
    container_name: fixedcoin-swarm-connector
    restart: unless-stopped
    environment:
      SWARM_HOST: 0.0.0.0
      SWARM_PORT: 5080
      SWARM_CIDR: ${SWARM_CIDR:-192.168.50.0/24}
      MINER_HTTP_PORT: ${MINER_HTTP_PORT:-80}
      MINER_HTTP_TIMEOUT: ${MINER_HTTP_TIMEOUT:-0.8}
      SWARM_SCAN_WORKERS: ${SWARM_SCAN_WORKERS:-32}
      SWARM_SCAN_INTERVAL: ${SWARM_SCAN_INTERVAL:-15}
      SWARM_ALLOW_CONTROL: ${SWARM_ALLOW_CONTROL:-false}
      SWARM_ADVERTISE_IP: ${SWARM_ADVERTISE_IP:-192.168.50.173}
      SWARM_ADVERTISE_PORT: ${SWARM_ADVERTISE_PORT:-5080}
    network_mode: host

volumes:
  fix-data:
