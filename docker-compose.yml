services:
  fixedcoin-solo:
    build:
      context: .
      args:
        FIX_VER: "29.1.3"
    container_name: fixedcoin-solo
    restart: unless-stopped
    environment:
      FIX_DATADIR: /data/fixedcoin
      FIX_RPCUSER: ${FIX_RPCUSER:-fixrpc}
      FIX_RPCPASS: ${FIX_RPCPASS:?Set FIX_RPCPASS in .env}
      FIX_RPCPORT: 24761
      FIX_P2PPORT: 24768
      FIX_DASH_PORT: 5050
      FIX_PAYOUT_ADDRESS: ${FIX_PAYOUT_ADDRESS:-}
      COINBASE_MATURITY: ${COINBASE_MATURITY:-100}
    ports:
      - "3333:3333"
      - "5050:5050"
      - "24768:24768"
    volumes:
      - fix-data:/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "fixedcoin-cli -datadir=/data/fixedcoin -rpcuser=$${FIX_RPCUSER:-fixrpc} -rpcpassword=$${FIX_RPCPASS} getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
volumes:
  fix-data:
