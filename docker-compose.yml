services:
  fixedcoin-solo:
    build:
      context: .
      args:
        FIX_VER: "29.1.3"
    container_name: fixedcoin-solo
    restart: unless-stopped
    environment:
      FIX_DATADIR: /data/fixedcoin
      FIX_RPCUSER: ${FIX_RPCUSER:-fixrpc}
      FIX_RPCPASS: ${FIX_RPCPASS:-}
      FIX_RPCPORT: 24761
      FIX_P2PPORT: 24768
      FIX_DASH_PORT: 5051
      FIX_PAYOUT_ADDRESS: ${FIX_PAYOUT_ADDRESS:-}
      COINBASE_MATURITY: ${COINBASE_MATURITY:-100}
      AXEOS_URL: ${AXEOS_URL:-http://192.168.50.133}
    ports:
      - "3333:3333"
      - "5051:5051"
      - "24768:24768"
    volumes:
      - fix-data:/data
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "RPCPASS=$$(sed -n 's/^rpcpassword=//p' /data/fixedcoin/fixedcoin.conf | head -1); fixedcoin-cli -datadir=/data/fixedcoin -rpcuser=$${FIX_RPCUSER:-fixrpc} -rpcpassword=\"$$RPCPASS\" getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  liveshare-dashboard:
    build:
      context: ./frontend
    container_name: liveshare-dashboard
    restart: unless-stopped
    depends_on:
      fixedcoin-solo:
        condition: service_healthy
    ports:
      - "5050:3000"
    networks:
      - default

volumes:
  fix-data:
