rpc:
  host: 127.0.0.1
  port: 24761
  user: fixrpc
  password: change-me
pool:
  payout_address: ""
  # Fixed-difficulty ASIC miners keep the canonical FixedCoin share difficulty.
  fixed_difficulty: 13354

  # VarDiff is opt-in per connection via password `x`.
  # Keep its initial/minimum difficulty independent from fixed_difficulty.
  start_difficulty: 1000
  min_difficulty: 1000
  vardiff_target_sec: 10
  vardiff_grace_sec: 15
  vardiff_max: 50000000
  vardiff: false

  # NMMiner/NerdMiner are detected from mining.subscribe and receive a
  # dedicated low-hash target. 0.001 is intentionally far below ASIC diff.
  # Override with FIX_NMMINER_DIFF when a different share cadence is desired.
  nmminer_difficulty: 0.001

  job_interval: 30
  stratum_host: 0.0.0.0
  stratum_port: 3333
monitor:
  host: 0.0.0.0
  port: 5050
